[project]
name = "capstone-931-sales-agent"
version = "0.1.0"
description = "A research-backed multi-agent sales account brief prototype for CAP 931."
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.40.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "reportlab>=4.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sales_agent"